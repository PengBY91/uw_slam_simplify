# 跟 platform.yaml 完全一样，唯一区别是显式打开 loop_closure（其余字段沿用
# LoopClosureConfig 的结构体默认值，见 include/runtime/config.hpp）。独立成
# 一份文件而不是往 platform.yaml 里加，是因为 platform.yaml 是本仓库其余所有
# experiment 的共享默认值——loop_closure 默认关闭这件事本身就是保证其余
# experiment 零行为变化的机制，不应该被一次性的对比实验改掉。
#
# 配合 configs/scenario/synthetic_loop_closure.yaml（整整一圈、回到起点的合成
# 轨迹）使用，见 configs/experiment/synthetic_loop_closure_vo_enabled.yaml。

estimation:
  solver: gauss_newton_v1
  max_iterations: 30
  initial_lambda: 1.0e-3
  warmup_seconds: 0.0

reliability:
  default_sqrt_information:
    relative_pose:
      translation: 20.0
      rotation: 20.0
    sonar_range: 15.0
    depth: 20.0

frontends:
  sonar_cfar:
    training_cells: 16
    guard_cells: 4
    probability_false_alarm: 0.01
    detector_threshold: 50
    dbscan_eps_m: 0.20
    dbscan_min_samples: 2
    default_range_sigma_m: 0.05
    default_bearing_sigma_rad: 0.01

loop_closure:
  enabled: true
