# 【整圈场景】与 synthetic_smoke.yaml 的区别只有两处：arc_radians 覆盖一整圈
# （2π）而非 80° 短弧；num_keyframes 从 12 提到 48——保持相近的角密度，且首尾
# keyframe 序号差 47 远超回环检索的时间近邻门槛（min_keyframe_index_gap=15），
# 回环候选不会被时间邻近判据误伤。
#
# 整圈的意义：synth_bag_gen 的合成视觉 landmark 云按世界坐标生成一次、每个
# keyframe 复用同一份（不是逐帧重新生成），所以真正转一圈回到起点时，起点附近
# 那批 landmark 会再次进入相机视野、呈现同样的图案——是真正的"视觉重访"，
# 不只是位置数值上接近，回环闭合才有东西可匹配。
#
# 配对实验：experiment/synthetic_loop_closure_vo.yaml（回环关，基线）与
# synthetic_loop_closure_vo_enabled.yaml（回环开），同一份 bag 对比 ATE。

seed: 42              # 随机种子
num_keyframes: 48     # keyframe 数（提到 48 的原因见头部注释）
radius_m: 8.0         # 半径 8m 水平圆弧
arc_radians: 6.283185307179586  # 2π：整整一圈，最后一个 keyframe 回到起点姿态
depth_m: 12.0         # 水深 12m（正向下）；world frame 为 Z-up，位姿 z = -12

noise:                # 三路噪声各自的 σ
  relative_pose_noise_m: 0.02
  sonar_range_noise_m: 0.03
  sonar_bearing_noise_rad: 0.01

# 声呐点目标，同 synthetic_smoke.yaml 的三个（不在相机视场内，无妨：本场景
# 考察的是视觉回环，不是声光融合）。
sonar_targets_world:
  - [2.0, 3.0, -13.0]
  - [6.0, 6.0, -11.5]
  - [-1.0, 8.0, -12.5]
