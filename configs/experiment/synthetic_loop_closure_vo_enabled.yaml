# 【回环闭合对比 · 实验组（回环开）】与 synthetic_loop_closure_vo.yaml 除
# defaults 外逐字段一致：defaults 换成 platform_loop_closure.yaml（其唯一区别
# 即 loop_closure.enabled: true）。同一份 bag 对比两者 ATE，即回环闭合的
# 端到端效果验证。
#
# 实测基线（2026-08-26，回环参数全部用结构体默认值：检索半径 3m / 序号差 ≥15 /
# Huber δ=1.5）：找到 2 条回环边，ATE rmse≈0.475m（基线 0.480m）——改善很小。
# 这是 v1 的边界而不是回归：回环检索是位姿邻近 + 固定 Harris 角点检测器，与
# synth_bag_gen 给合成场景调的高亮方块图案不是同一套外观假设；实测把检索半径
# 放宽到 8~20m 后回环边涨到 2~34 条、ATE 反而从 ~1.3m 恶化到 ~9.2m（错误匹配
# 涌入，Huber 压不住）。默认参数刻意保守，不要为了数字好看去放宽它。
#
# 求解器在回环边加入后 4 次迭代 stall——解仍然有限、与基线同量级，不是发散，
# 只是没在迭代预算内收敛到容差，所以下方 require_converged 关掉：如实呈现
# stall，不硬卡收敛也不掩盖。

# ---- 三层引用。路径相对 configs/ 目录（不是本文件所在目录）----
#   rig       机体标定：传感器外参/内参/噪声模型
#   scenario  合成数据参数：轨迹/噪声/声呐目标/seed（只被 synth_bag_gen 消费）
#   defaults  平台级算法默认值：求解器/证据权重上限/CFAR 参数/回环开关
rig: rig/example_auv.yaml
scenario: scenario/synthetic_loop_closure.yaml
defaults: defaults/platform_loop_closure.yaml   # 相对基线的唯一区别：打开回环

# ---- 算法选择。写不认识的值 replay_demo 启动即报错，不会静默回退 ----
# frontends.optical / frontends.sonar / map_backend 目前各自只有一个受支持的
# 实现，还没有第二实现可切换。
frontends:
  optical: stereo_depth_frontend_v1
  sonar: sonar_cfar_frontend_v1

# 本实验管线的因子类型。声明性文档：loader 不解析，实际构造哪些因子由 bag 里
# 存在的证据话题决定。
factor_builders:
  - relative_pose_v1
  - sonar_range_v1
  - depth_v1

# 相对位姿证据来源（历史字段名，不切换求解器；所有取值最终喂同一个
# Gauss-Newton 求解器）：
#   black_box_vio       读 bag 里 /evidence/relative_pose 的预生成量测（synth_bag_gen 写入）
#   stereo_landmark_vo  从 /raw/camera/{left,right} 实时计算（需 rig 带相机） ← 本文件
#   imu_preintegration  IMU 预积分惯性推算（synth_bag_gen 据此生成 /raw/imu 流）
estimator_mode: stereo_landmark_vo
map_backend: submap_point_cloud_v1   # 预留的地图实现选择，当前唯一受支持值

output:
  trajectory_format: tum    # 声明性字段，loader 不解析
  write_run_manifest: true  # 写不可变 RunManifest（记录实际生效的配置/标定/代码哈希）

# ---- 验收 gate：replay_demo 求解完逐条检查，任一不满足即 exit 2（输出仍照常写出）----
gates:
  # 见头部注释：stall 但解有限、非发散，不硬卡收敛，只看轨迹结果是否合理。
  require_converged: false
  max_ate_rmse_m: 2.0         # ATE rmse 上限（米），<0 = 不启用
  min_matched_ate_poses: 40   # 参与 ATE 对齐的位姿数下限
  require_nonempty_map: true  # 地图非空（optical-only 深度点即可满足）
