# 【IMU 对照 bag 生成器】与 synthetic_imu_preintegration.yaml 唯一区别是 rig
# 换成带双目相机的 example_auv.yaml。存在目的只有一个：生成对照 bag，验证
# "生成相机图像与否不改变 /raw/imu 的一个字节"
# （tests/integration/synthetic_imu_fixture_test.sh 把关）。两个前提刻意保证：
# 两份 rig 的 imu_noise 和 base_link→imu_link 外参完全一致；synth_bag_gen 里
# 每种噪声用途各占一条独立 salted RNG 流，相机路径不消耗 IMU 流。
#
# 不要用这份文件跑 replay_demo：带相机的 rig 会触发与惯性闭环无关的逐像素
# 声光稠密路径。

rig: rig/example_auv.yaml
scenario: scenario/synthetic_smoke.yaml
defaults: defaults/platform.yaml

factor_builders:
  - imu_preintegration_v1
  - sonar_range_v1
  - depth_v1

estimator_mode: imu_preintegration
